<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026秋SIN新生群</title>
    <!-- 引入 jsQR 库用于识别二维码 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        /* 基础页面样式 */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        /* 白色卡片容器 */
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 320px;
            width: 85%;
        }
        .title {
            margin-top: 0;
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        /* 切换按钮 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 0;
            border: 2px solid #e0e0e0;
            background-color: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.3s ease;
            font-weight: bold;
            outline: none;
        }
        .tab-btn.active.wechat {
            border-color: #07c160;
            color: #07c160;
            background-color: rgba(7, 193, 96, 0.05);
        }
        .tab-btn.active.line {
            border-color: #06c755;
            color: #06c755;
            background-color: rgba(6, 199, 85, 0.05);
        }
        /* 二维码显示区 */
        .qrcode-wrapper {
            position: relative;
            width: 100%;
            height: 280px; 
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
            background-color: #fafafa;
            border-radius: 8px;
        }
        
        #original-img {
            display: none;
        }

        /* 最终呈现的 Canvas 样式 */
        #qr-canvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            transition: opacity 0.3s ease;
            opacity: 0; 
            /* 保证缩放时边缘依然锐利 (兼容各浏览器) */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        /* 加载提示 */
        .loading {
            position: absolute;
            color: #999;
            font-size: 14px;
        }

        /* 文字说明 */
        .description {
            color: #333333;
            font-size: 16px;
            line-height: 1.6;
        }
        .description span {
            display: block;
            color: #666666;
            font-size: 14px;
            margin-top: 6px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="title">2026秋SIN新生群</h2>
        
        <div class="tabs">
            <button class="tab-btn wechat active" onclick="switchQR('wechat')">微信群</button>
            <button class="tab-btn line" onclick="switchQR('line')">LINE群</button>
        </div>

        <div class="qrcode-wrapper">
            <div id="loading-text" class="loading">正在处理二维码...</div>
            <img id="original-img">
            <canvas id="qr-canvas"></canvas>
        </div>
        
        <div class="description">
            <strong>请扫描上方二维码加Settle新生群</strong>
            <span id="desc-tip">进群后将昵称改为：房间号+专业+姓名</span>
        </div>
    </div>

    <script>
        const imgElement = document.getElementById('original-img');
        const canvas = document.getElementById('qr-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const loadingText = document.getElementById('loading-text');
        
        const descTip = document.getElementById('desc-tip');
        const wechatBtn = document.querySelector('.tab-btn.wechat');
        const lineBtn = document.querySelector('.tab-btn.line');

        // 基础配置
        const config = {
            padding: 20 // 适当增加边距，让二维码识别率更高
        };

        function processImage(src) {
            canvas.style.opacity = 0;
            loadingText.style.display = 'block';

            imgElement.src = src + '?t=' + new Date().getTime();
            
            imgElement.onload = function() {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = imgElement.naturalWidth;
                tempCanvas.height = imgElement.naturalHeight;
                const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
                tempCtx.drawImage(imgElement, 0, 0);

                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    const loc = code.location;
                    
                    const minX = Math.min(loc.topLeftCorner.x, loc.bottomLeftCorner.x);
                    const maxX = Math.max(loc.topRightCorner.x, loc.bottomRightCorner.x);
                    const minY = Math.min(loc.topLeftCorner.y, loc.topRightCorner.y);
                    const maxY = Math.max(loc.bottomLeftCorner.y, loc.bottomRightCorner.y);

                    let qrWidth = maxX - minX;
                    let qrHeight = maxY - minY;

                    let sideLength = Math.max(qrWidth, qrHeight);
                    let finalCropSize = sideLength + (config.padding * 2);

                    let startX = minX - ((finalCropSize - qrWidth) / 2);
                    let startY = minY - ((finalCropSize - qrHeight) / 2);

                    startX = Math.max(0, startX);
                    startY = Math.max(0, startY);

                    // 优化核心 1：不压缩像素，Canvas 画布大小设为实际裁切出的高分辨率尺寸
                    canvas.width = finalCropSize;
                    canvas.height = finalCropSize;

                    // 优化核心 2：关闭抗锯齿平滑，保证黑白方块边缘锐利
                    ctx.imageSmoothingEnabled = false;

                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // 原画质绘制到高分辨率 Canvas 上，然后由 CSS 控制展示大小
                    ctx.drawImage(
                        tempCanvas, 
                        startX, startY, finalCropSize, finalCropSize, 
                        0, 0, finalCropSize, finalCropSize
                    );
                } else {
                    console.warn("未能识别出二维码位置，使用原图显示。");
                    // 降级处理也同样保持原图分辨率
                    canvas.width = imgElement.naturalWidth;
                    canvas.height = imgElement.naturalHeight;
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(imgElement, 0, 0);
                }

                loadingText.style.display = 'none';
                canvas.style.opacity = 1;
            };

            imgElement.onerror = function() {
                loadingText.innerText = "图片加载失败";
            };
        }

        function switchQR(platform) {
            if (platform === 'wechat') {
                wechatBtn.classList.add('active');
                lineBtn.classList.remove('active');
                descTip.innerText = '进群后将昵称改为：房间号+专业+姓名';
                processImage('qrcode_Wechat.JPG');
            } else if (platform === 'line') {
                lineBtn.classList.add('active');
                wechatBtn.classList.remove('active');
                descTip.innerText = '进群后将“房间号+专业+姓名“私信"ヒョウ"或发送至群聊';
                processImage('qrcode_LINE.JPG');
            }
        }

        switchQR('wechat');
    </script>
</body>
</html>
